name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest tests/direct -q
      - run: genvm-lint check contracts/grant_overlap.py
      - run: genvm-lint check contracts/grant_overlap_v2.py
